<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Tindahan">
  <title>Tindahan</title>
  <!--
    Site icon. Colours are the sRGB equivalents of the design tokens so the tab
    icon matches the in-app wordmark: #2E7A50 is the brand token
    oklch(0.52 0.1 156), and #F9FDFA is the primary-foreground token
    oklch(0.99 0.005 150). Geometry mirrors Wordmark: a green rounded tile
    (rounded-md on a size-7 box, so rx 9 at 32px) with a centred Gabarito T.
    The T is a path rather than text, because a favicon cannot rely on any
    font being available to render it.

    Token names are spelled out rather than written with their CSS leading
    hyphens: XML forbids a double hyphen inside a comment, and a browser that
    fails to parse this file as XML silently falls back to its own cached
    icon instead of showing ours.
  -->
  <rect width="32" height="32" rx="9" fill="#2E7A50" />
  <path fill="#F9FDFA" d="M8 9.5h16v4h-5.5v9h-5v-9H8z" />
</svg>
